<html lang="zh">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>l4d2</title>
  <link href="static/css/bootstrap.min.css" rel="stylesheet">
  <link href="static/css/materialdesignicons.min.css" rel="stylesheet">
  <link href="static/css/style.min.css" rel="stylesheet">
  <script src="static/js/xterm.js"></script>
  <script src="static/js/xterm-addon-fit.min.js"></script>
  <link href="static/css/xterm.min.css" rel="stylesheet">
  <link rel="stylesheet"
    href="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/element-ui/2.11.1/theme-chalk/index.css">
  <link href="static/css/animate.css" rel="stylesheet">
  <link href="static/css/l4d2.css" rel="stylesheet">

<body>
  <div class="lyear-layout-web">
    <main>
      <div class="container-fluid">
        <div class="row">
          <div class="col-xs-12">
            <div class="card">
              <div class="card-body" style="overflow: scroll;margin: 5px;height: 98%;">

                <ul id="Tabs" class="nav nav-tabs" role="tablist">
                  <li id="start_game_tab_btn" class="active"><a href="#start_game_tab" role="tab" data-toggle="tab"
                      aria-expanded="true">控制台</a></li>
                  <li class=""><a href="#game_config_tab" role="tab" data-toggle="tab" aria-expanded="false">游戏配置</a>
                  </li>
                  <li class=""><a href="#game_mod_tab" role="tab" data-toggle="tab" aria-expanded="false">Mod</a></li>
                </ul>

                <div class="tab-content" id="TabsContent">
                  <div class="tab-pane fade active in" id="start_game_tab">
                    <div class="content" id="start_game_content"
                      style="background-image: url(static/image/login-bg-3.jpg);background-size: cover">
                      <div class="terminal-container">
                        <div class="terminal-header">
                          <div class="terminal-title">
                            <i class="mdi mdi-console-line"></i>
                            <button class="action-btn" id="start-btn">
                              <i class="mdi mdi-play-circle"></i>
                              <span>启动服务</span>
                            </button>
                            <button class="action-btn" id="stop-btn">
                              <i class="mdi mdi-power"></i>
                              <span>停止服务</span>
                            </button>
                            <button class="action-btn" id="clear-btn">
                              <i class="mdi mdi-eraser"></i>
                              <span>清除</span>
                            </button>
                          </div>
                          <div class="terminal-actions">
                            <div class="status">
                              <div class="status-indicator" id="statusIndicator"></div>
                              <span id="statusText">未连接</span>
                            </div>
                          </div>
                        </div>
                        <div class="terminal-wrapper">
                          <div id="terminal"></div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="tab-pane fade" id="game_config_tab">
                    <form>
                      <div class="form-group" v-for="(field, key) in config" :key="key">
                        <label class="form-label">
                          <i :class="getFieldIcon(field.type)"></i>${ field.name }
                        </label>
                        <input v-if="field.type === 'input_int' " type="number" class="form-control"
                          v-model="formValues[key]">
                        <input v-if="field.type === 'input_str'" type="text" class="form-control"
                          @input="formValues[key] = $event.target.value.replace(/\s+/g, '')" v-model="formValues[key]">
                        <select v-else-if="field.type === 'select' && isSingleLevel(field.options)" class="form-select"
                          v-model="formValues[key]">
                          <option v-for="(option, index) in flattenOptions(field.options)" :value="option.value"
                            :key="index">
                            ${ option.label }
                          </option>
                        </select>
                        <div v-else-if="field.type === 'select'">
                          <div class="form-group">
                            <select class="form-select" v-model="selectedGroups[key]" @change="resetSubSelection(key)">
                              <option v-for="(group, index) in field.options" :key="index" :value="index">
                                ${ getGroupName(group) }
                              </option>
                            </select>
                          </div>
                          <div class="sub-select" v-if="selectedGroups[key] !== null">
                            <select class="form-select" v-model="formValues[key]">
                              <option v-for="(item, idx) in getSubOptions(key)" :key="idx"
                                :value="getOptionValue(item)">
                                ${ getOptionLabel(item) }
                              </option>
                            </select>
                          </div>
                        </div>

                        <div class="form-hint" v-if="field.type === 'input_int'">
                          请输入整数
                        </div>
                        <div class="form-hint" v-else-if="field.type === 'input_str'">
                          请输入文本（不能含空格）
                        </div>
                      </div>
                      <div>
                        <button type="button" class="btn btn-w-xl btn-primary" @click="submitForm">
                          <i class="mdi mdi-18px mdi-rotate-315 mdi-send"></i>提交配置
                        </button>
                      </div>
                    </form>
                  </div>

                  <div class="tab-pane fade" id="game_mod_tab">
                    <button type="button" class="btn btn-primary btn-lg" data-toggle="modal" data-target="#uploadModal">
                      上传
                    </button>
                    <button type="button" class="btn btn-link btn-lg" data-toggle="tooltip" data-placement="right" title
                      data-original-title="mod上传后需重启游戏服务器才可生效">
                      <i class="mdi mdi-information mdi-24px"></i>
                    </button>
                    <hr>
                    <div class="modal fade" tabindex="-1" role="dialog" id="uploadModal" style="display: none;">
                      <div class="modal-dialog" role="document">
                        <div class="modal-content">
                          <div class="modal-header">
                            <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                                aria-hidden="true">×</span></button>
                            <h4 class="modal-title" id="gridSystemModalLabel">点击上传</h4>
                          </div>
                          <div class="modal-body upload-container">
                            <div class="upload-area" id="dropArea" v-if="isshowuploadarea"
                              onclick="document.getElementById('fileInput').click()">
                              <div class="upload-icon">
                                <i class="bi bi-cloud-arrow-up"></i>
                              </div>
                              <div class="upload-text">
                                <h3>点击或拖放文件到此处上传</h3>
                              </div>
                              <input type="file" style="display: none;" id="fileInput" accept=".vpk"
                                @change="handleFiles($event.target.files)" multiple>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-3">
                              <h5>已选文件 <span class="file-counter">${this.modFiles.length}</span></h5>
                            </div>
                            <div class="file-preview" id="filePreview">
                              <div class="text-center py-5" id="emptyState">
                                <p class="text-muted mt-3">暂无文件，请选择或拖放文件</p>
                              </div>
                            </div>
                            <button id="startUploadBtn" class="btn btn-block btn-primary" @click="uploadMod(modFiles)"
                              :disabled="this.isshowuploadbtn">
                              开始上传
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                    <div class="table-container">
                      <el-table :data="modlist" :default-sort="{prop: 'time', order: 'descending'}">
                        <el-table-column type="index" label="序号" width="60"></el-table-column>
                        <el-table-column prop="tag" label="Mod名称" sortable>
                        </el-table-column>
                        <el-table-column prop="file" label="文件名称" sortable>
                        </el-table-column>
                        <el-table-column prop="time" label="上传时间" sortable>
                        </el-table-column>
                        <el-table-column prop="user" label="上传用户" sortable>
                        </el-table-column>
                        <el-table-column label="操作">
                          <template slot-scope="scope">
                            <el-button type="danger" size="mini" @click="deleteMod(scope.row)">
                              删除
                            </el-button>
                          </template>
                        </el-table-column>

                      </el-table>
                    </div>
                  </div>
                </div>
              </div>
            </div>

          </div>
    </main>
  </div>
  <script type="text/javascript"
    src="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/vue/2.6.14/vue.min.js"></script>
  <script type="text/javascript"
    src="https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/element-ui/2.7.1/index.js"></script>
  <script type="text/javascript" src="static/js/bootstrap-notify.min.js"></script>
  <script type="text/javascript" src="static/js/bootstrap.min.js"></script>
  <script type="text/javascript" src="static/js/lightyear.js"></script>
  <script type="text/javascript" src="static/js/l4d2.js"></script>
</body>

</html>
