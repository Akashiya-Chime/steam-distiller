<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理</title>
    <link href="static/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="static/css/bootstrap.min.css" rel="stylesheet">
    <link href="static/css/animate.css" rel="stylesheet">
    <link href="static/css/admin.css" rel="stylesheet">
</head>

<body style="background-image: url(static/image/login-bg-3.jpg); background-size: cover;">
    <div class="center-container">
        <div class="container">
            <h1>获取邀请码</h1>
            <p class="subtitle">获取您的专属邀请码，邀请好友加入我们</p>

            <div class="invite-container">
                <div class="invite-btn" id="inviteBtn">
                    <div class="btn-text">
                        <i class="btn-icon mdi mdi-account-plus"></i>
                        <div>获取邀请码</div>
                    </div>
                </div>

                <div class="loading" id="loading"></div>

                <div class="code-container" id="codeContainer">
                    <div class="code-label">您的专属邀请码</div>
                    <div class="code-box" id="codeBox">
                        <span class="code-value" id="codeValue"></span>
                        <i class="copy-icon mdi mdi-content-copy"></i>
                    </div>
                </div>
            </div>

            <div class="instructions">
                <h3>使用说明：</h3>
                <ul>
                    <li>点击上方按钮获取您的专属邀请码</li>
                    <li>邀请码生成后，点击邀请码区域即可复制</li>
                    <li>每个邀请码只能使用一次</li>
                    <li>邀请码有效期为24小时</li>
                </ul>
            </div>

            <div class="footer">
                © 2025 steam-distiller. All rights reserved.
            </div>
        </div>
    </div>
    <script src="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/jquery-cookie/1.4.1/jquery.cookie.min.js"></script>
    <script src="static/js/bootstrap-notify.min.js"></script>
    <script src="static/js/lightyear.js"></script>
    <script src="static/js/admin.js"></script>
</body>

</html>
