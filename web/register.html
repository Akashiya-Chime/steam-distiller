<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>steam-distiller 注册</title>
  <link rel="icon" href="static/image/neko.ico" type="image/ico">
  <link href="static/css/bootstrap.min.css" rel="stylesheet">
  <link href="static/css/materialdesignicons.min.css" rel="stylesheet">
  <link href="static/css/style.min.css" rel="stylesheet">
  <link href="static/css/login.css" rel="stylesheet">
  <link href="static/css/animate.css" rel="stylesheet">
</head>

<body>
  <div class="row lyear-wrapper" style="background-image: url(static/image/login-bg-3.jpg); background-size: cover;">
    <div class="lyear-login" id="content">
      <div class="login-center">
        <div class="login-header text-center">
          <h2 class="text-white">欢迎注册</h2>
        </div>
        <form>
          <div class="form-group has-feedback feedback-left">
            <input type="text" v-model="user_info.user" placeholder="请输入您的用户名" class="form-control text-white collapsed"
              name="username" id="username" @focus="expand_collapse" @blur="collapse" @input="change_status" />
            <span class="mdi mdi-account form-control-feedback" aria-hidden="true"></span>
            <div class="m-t-10 collapse" id="username_require" aria-expanded="false">
              <div class="well">
                <p class="small ">
                  <span class="mdi mdi-alert-circle text-warning" aria-hidden="true"></span>
                  <strong>&nbsp;4~16位的数字和字母组合</strong>
                </p>
              </div>
            </div>
          </div>
          <div class="form-group has-feedback feedback-left">
            <div class="input-group m-b-10">
              <input type="text" v-model="user_info.pass" placeholder="请输入密码" class="form-control text-white"
                id="password" name="password" @focus="expand_collapse" @blur="collapse" @input="change_status" />
              <span class="mdi mdi-lock form-control-feedback" aria-hidden="true"></span>
              <div class="input-group-btn">
                <button type="button" class="btn password-icon" @click="change_password_show">
                  <span class="text-white mdi mdi-eye"></span>
                </button>
              </div>
            </div>
          </div>
          <div class="form-group has-feedback feedback-left">
            <div class="m-t-10 collapse" id="password_require" aria-expanded="false">
              <div class="well">
                <p>
                  <span class="mdi mdi-alert-circle text-warning" aria-hidden="true"></span>
                  <strong>&nbsp;4~16位的数字和字母组合</strong>
                </p>
              </div>
            </div>
          </div>
          <div class="form-group has-feedback feedback-left">
            <input type="text" v-model="user_info.invitation_code" placeholder="请输入邀请码" class="form-control text-white"
              id="invitation_code" name="invitation_code" />
            <span class="mdi mdi-shield-half-full form-control-feedback" aria-hidden="true"></span>
          </div>
          <div class="form-group">
            <button class="btn btn-block btn-primary" @click="register" type="button">立即注册</button>
          </div>
        </form>
        <footer class="col-sm-12 text-center text-white">
          <p class="m-b-0">Copyright © 2025. All right reserved</p>
        </footer>
      </div>
    </div>
  </div>
  <script src="static/js/jquery.min.js"></script>
  <script type="text/javascript" src="static/js/bootstrap.min.js"></script>
  <script src="static/js/vue.min.js"></script>
  <script src="static/js/vue-resource.min.js"></script>
  <script src="static/js/bootstrap-notify.min.js"></script>
  <script src="static/js/md5.min.js"></script>
  <script src="static/js/lightyear.js"></script>
  <script src="static/js/register.js"></script>
</body>

</html>
