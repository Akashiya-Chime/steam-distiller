// 服务器配置
sv_cheats 1                  // 是否禁用作弊
sv_allow_lobby_connect_only 0 //不允许从大厅选择组服务器来连接
sv_consistency 0             // 不检查文件一致性，避免闪退
hostport 27015               // 服务器端口
sv_region 4                  // 服务器地区为亚洲
sv_lan 0                     // 允许外网加入
sm_setmax 7 // 人数上限
sb_all_bot_game 1

// 游戏模式与难度
mp_gamemode "coop"        // 游戏模式
// realism // 写实
// Mutation4 突变Hard Eight
// community1 Special Delivery 【特感速递】
// sm_cvar mp_gamemode "versus"        // 游戏模式，对抗

z_difficulty "impossible"    // 难度,Difficulty Setting: easy, normal, hard, impossible

// 对抗模式配置
sm_cvar sb_all_bot_team 1 // 允许对抗阵营只有bot
sm_cvar allow_all_bot_survivor_team 1
sm_cvar vs_max_team_switches 999
sm_cvar mp_gamemode_versus_score_limit 0
sm_cvar mp_timelimit 0
sm_cvar mp_enableroundwaittime 1
sm_cvar mp_bonusroundtime 6
sm_cvar sv_pure 0
sm_cvar sb_move 1
sm_cvar sb_escort 1
sm_cvar sb_stop 0
sm_cvar sb_teamwork 1

//100 tick
sm_cvar net_splitpacket_maxrate 50000 //数据包每秒的最大字节数
sm_cvar nb_update_frequency 0.03 //AI的更新频率
sm_cvar nb_update_framelimit 60 // AI更新频率限制
sm_cvar z_push_force 500 // 右键推力
sm_cvar tick_door_speed 1.3 // 门的速度，适应服务器tick
sm_cvar fps_max 0 //最大帧率限制,0为无限制
sm_cvar sv_minrate 100000 //最小速率,单位为bit/s
sm_cvar sv_maxrate 100000 //最大速率,单位为bit/s
sm_cvar sv_mincmdrate 100 //每秒发送的最小命令数
sm_cvar sv_maxcmdrate 100 //每秒发送的最大命令数
sm_cvar sv_minupdaterate 100
sm_cvar sv_maxupdaterate 100 //分别是最小更新频率和最大更新频率
sm_cvar sv_client_min_interp_ratio -1 //定义客户端可设置的最小插值比率
sm_cvar sv_client_max_interp_ratio 0 //定义客户端可设置的最大插值比率

#!/bin/sh
MAP="c1m1_hotel"
echo "[run_server.sh] Set map: ${MAP}"
/home/lighthouse/l4d2-server/srcds_run -nomaster -insecure -game left4dead2 +maxplayers 8 +map ${MAP} -tickrate 100 +exec server.cfg -console +log on